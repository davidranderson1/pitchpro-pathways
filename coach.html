<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>PitchPro Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0a120d">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --bg:#0a120d; --card:#101a14; --card2:#15211a; --card3:#1b2a21; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --green:#2ee08a; --green-dim:rgba(46,224,138,.35); --green-bg:rgba(46,224,138,.12); --blue:#5fb4ff; --blue-bg:rgba(95,180,255,.14);
    --amber:#ffc857; --amber-bg:rgba(255,200,87,.12); --red:#ff7a6e; --red-bg:rgba(255,122,110,.14); --purple:#b79bff;
    --txt:#f2f7f4; --muted:#9db3a6; --ink:#06130c;
    --nav-h:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--txt);font:15px/1.55 Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  [hidden]{display:none !important}
  a{color:var(--blue)}
  button{font-family:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .demo{position:sticky;top:0;z-index:60;background:var(--amber);color:#231602;font:800 11px/1.3 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:6px 10px}
  .demo b{font-weight:900}
  /* shell */
  .shell{display:grid;grid-template-columns:1fr;min-height:100vh}
  .rail{display:none}
  main{min-width:0}
  .wrap{max-width:820px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + 28px)}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 14px;flex-wrap:wrap}
  .brand{font:900 15px/1.2 Archivo,Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--green);white-space:nowrap}
  .brand span{color:var(--txt)}
  .hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .pill{font:800 10.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .pill:hover{color:var(--txt);border-color:var(--line2)}
  .pill.team{color:var(--txt)}
  .pill.team b{color:var(--green)}
  .pill.lang span{opacity:.45}
  .pill.lang span.on{opacity:1;color:var(--green)}
  .avatarBtn{width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);color:var(--txt);font:800 12px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
  /* bottom nav (phone) */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,18,13,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.bottom button{flex:1 1 0;background:none;border:0;color:var(--muted);font:800 9.5px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:6px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;border-radius:10px}
  nav.bottom button .ic{font-size:19px;line-height:1}
  nav.bottom button[aria-current="page"]{color:var(--green)}
  nav.bottom button .n,.rail button .n{position:absolute;top:0;right:12%;background:var(--amber);color:var(--ink);border-radius:999px;padding:2px 6px;font-size:9.5px;font-weight:900}
  /* desktop rail */
  @media (min-width:960px){
    .shell{grid-template-columns:220px 1fr}
    .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:22px 12px}
    .rail .rbrand{font:900 14px/1.2 Archivo,Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--green);padding:6px 10px 18px}
    .rail .rbrand span{color:var(--txt)}
    .rail button{background:none;border:0;color:var(--muted);font:700 14px Inter,sans-serif;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:12px;position:relative}
    .rail button .ic{width:22px;text-align:center;font-size:17px}
    .rail button:hover{color:var(--txt);background:var(--card2)}
    .rail button[aria-current="page"]{color:var(--green);background:rgba(46,224,138,.08)}
    .rail button .n{position:static;margin-left:auto}
    .rail .rfoot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 12px;line-height:1.5}
    nav.bottom{display:none}
    header.top .brand{display:none}
    .wrap{padding-bottom:40px;max-width:900px}
  }
  /* generic */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .card.tight{padding:12px 14px}
  .card.accent{border-color:var(--green-dim)}
  .card.warn{border-color:rgba(255,200,87,.45)}
  h2.scr{font:900 18px/1.3 Archivo,Inter,sans-serif;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  h2.scr:focus{outline:none}
  h2.scr small{font:600 12.5px/1.4 Inter,sans-serif;color:var(--muted);letter-spacing:0;text-transform:none}
  h3.sec{font:800 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  h3.sec a,h3.sec button.link{font:700 11px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:none;color:var(--blue);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .sub{font-size:13px;color:var(--muted)}
  .muted{color:var(--muted)}
  .chip{display:inline-block;font:800 10px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:5px 9px;white-space:nowrap;vertical-align:middle}
  .chip.t-training{background:var(--green-bg);color:var(--green)}
  .chip.t-match{background:var(--blue-bg);color:var(--blue)}
  .chip.t-tournament{background:var(--blue-bg);color:var(--blue)}
  .chip.t-duty{background:var(--amber-bg);color:var(--amber)}
  .chip.t-no_session,.chip.grey{background:rgba(255,255,255,.06);color:var(--muted)}
  .chip.amber{background:var(--amber-bg);color:var(--amber)}
  .chip.red{background:var(--red-bg);color:var(--red)}
  .chip.green{background:var(--green-bg);color:var(--green)}
  .chip.blue{background:var(--blue-bg);color:var(--blue)}
  .chip.purple{background:rgba(183,155,255,.14);color:var(--purple)}
  .chip.teamc{background:rgba(255,255,255,.06);color:var(--txt)}
  .btn{background:var(--card2);border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:9px 13px;font:800 11px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--green-dim)}
  .btn.primary{background:var(--green);color:var(--ink);border-color:var(--green)}
  .btn.primary:hover{background:#4ff0a0}
  .btn.blue{color:var(--blue);border-color:rgba(95,180,255,.35)}
  .btn.danger{color:var(--red);border-color:rgba(255,122,110,.35)}
  .btn.amber{color:var(--amber);border-color:rgba(255,200,87,.4)}
  .btn.sm{padding:7px 10px;font-size:10px}
  .btn.full{width:100%;justify-content:center;padding:13px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.link{background:none;border:0;color:var(--blue);text-transform:none;letter-spacing:0;font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:2px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
  .tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:var(--txt);cursor:pointer;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .tile:hover{border-color:var(--green-dim)}
  .tile .big{font:900 22px/1.1 Archivo,Inter,sans-serif}
  .tile .lbl{font:800 10px/1.3 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .tile.amber .big{color:var(--amber)}
  .tile.green .big{color:var(--green)}
  .tile.blue .big{color:var(--blue)}
  .tile.red .big{color:var(--red)}
  .stack>*+*{margin-top:8px}
  /* forms */
  label{display:block;font:800 10.5px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
  label.inline{display:flex;align-items:center;gap:8px;margin:8px 0;font:700 13.5px Inter,sans-serif;letter-spacing:0;text-transform:none;color:var(--txt)}
  input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font:15px Inter,sans-serif}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green-dim)}
  input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--green);padding:0}
  textarea{min-height:80px;resize:vertical}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  @media (max-width:420px){.frow3{grid-template-columns:1fr 1fr} .hright{gap:6px} .pill{padding:7px 10px;font-size:10px} header.top{padding-bottom:10px}}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .ok{color:var(--green);font-size:13px;margin-top:8px;min-height:18px}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .fchip{background:var(--card);border:1px solid var(--line2);color:var(--muted);border-radius:999px;padding:7px 12px;font:800 11px/1 Inter,sans-serif;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
  .fchip.on{color:var(--ink);background:var(--green);border-color:var(--green)}
  .fchip.on.blue{background:var(--blue);border-color:var(--blue)}
  .fchip.on.amber{background:var(--amber);border-color:var(--amber)}
  .fchip.on.red{background:var(--red);border-color:var(--red)}
  .fchip:disabled{opacity:.45;cursor:default}
  .seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:var(--card);border:0;color:var(--muted);padding:9px 14px;font:800 11px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card2);color:var(--green)}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:700 13.5px Inter,sans-serif}
  .toggle .sw{width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:background .15s;flex:0 0 auto}
  .toggle .sw:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle[aria-pressed="true"] .sw{background:var(--green)}
  .toggle[aria-pressed="true"] .sw:after{left:21px}
  .toggle{background:none;border:0;color:var(--txt);padding:6px 0;text-align:left}
  /* events */
  .day{margin-bottom:14px}
  .dayhead{font:800 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px;display:flex;justify-content:space-between;gap:8px}
  .dayhead b{color:var(--txt)}
  .ev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;position:relative}
  .ev.cancelled{opacity:.7;border-style:dashed}
  .ev.cancelled h4{text-decoration:line-through;color:var(--muted)}
  .ev.today{border-color:var(--green-dim)}
  .ev h4{font:700 15px/1.35 Inter,sans-serif;margin:7px 0 2px}
  .ev .times{font:800 14px/1.4 Inter,sans-serif;margin-top:2px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .ev .times .rep{color:var(--amber)}
  .ev .times .rep small,.ev .times .st small{font:700 10px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .ev .meta{font-size:13px;color:var(--muted);margin-top:4px}
  .ev .meta a{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
  .ev .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .ev .acts .btn{padding:8px 10px;font-size:10px}
  .attbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .attbar .a{font:800 11.5px/1 Inter,sans-serif;border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;border:1px solid transparent}
  .attbar .a.g{color:var(--green)}.attbar .a.m{color:var(--amber)}.attbar .a.n{color:var(--red)}.attbar .a.q{color:var(--txt)}
  .attbar .a:hover{border-color:var(--line2)}
  .receipt{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .receipt b{color:var(--txt)}
  .names{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .names b{color:var(--txt);font-weight:700}
  .names .g{color:var(--green)}.names .m{color:var(--amber)}.names .n{color:var(--red)}
  /* players */
  .plist{display:flex;flex-direction:column;gap:6px}
  .prow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left;color:var(--txt);width:100%}
  .prow:hover{border-color:var(--green-dim)}
  .av{width:38px;height:38px;border-radius:50%;background:var(--card3);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font:800 12px Inter,sans-serif;color:var(--txt);flex:0 0 auto;position:relative}
  .av.sm{width:30px;height:30px;font-size:10.5px}
  .av .sh{position:absolute;right:-5px;bottom:-4px;background:var(--green);color:var(--ink);border-radius:999px;font:900 9.5px/1 Inter,sans-serif;padding:3px 5px;min-width:18px;text-align:center}
  .prow .pn{flex:1 1 auto;min-width:0}
  .prow .pn b{display:block;font-size:14.5px}
  .prow .pn small{display:block;font-size:12px;color:var(--muted)}
  .prow .pr{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
  .prow .pr b{display:block;color:var(--txt);font-size:14px}
  .regrow{flex-wrap:wrap}
  .regrow .seg{flex:1 1 100%;display:flex}
  .regrow .seg button{flex:1;text-align:center}
  @media (min-width:560px){.regrow .seg{flex:0 0 auto}.regrow .seg button{flex:0 0 auto}}
  .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--green);border-radius:999px}
  /* lineup pitch */
  .luPitch{position:relative;width:100%;aspect-ratio:68/96;max-height:520px;margin:10px 0;border-radius:12px;background:linear-gradient(180deg,#1f7f47,#1a6b3d);border:2px solid rgba(255,255,255,.35);overflow:hidden}
  .luPitch:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.35)}
  .luPitch:after{content:'';position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.35);border-radius:50%}
  .luBox{position:absolute;left:50%;transform:translateX(-50%);width:44%;height:12%;border:2px solid rgba(255,255,255,.35);border-top:0}
  .luBox.top{top:-2px;border-top:0;border-bottom:2px solid rgba(255,255,255,.35)}
  .luBox.bot{bottom:-2px;border-bottom:0;border-top:2px solid rgba(255,255,255,.35)}
  .luSlot{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;width:66px;z-index:2;background:none;border:0;color:#fff;padding:0}
  .luDot{width:36px;height:36px;border-radius:50%;margin:0 auto;background:rgba(6,19,12,.55);border:2px dashed rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font:900 13px Inter,sans-serif;color:#fff}
  .luSlot.filled .luDot{background:#fff;color:var(--ink);border:2px solid #fff}
  .luSlot.sel .luDot{box-shadow:0 0 0 3px var(--amber)}
  .luSlot.warn .luDot{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,122,110,.6)}
  .luName{font:700 10.5px/1.15 Inter,sans-serif;margin-top:3px;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bench{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .bench button{background:var(--card2);border:1px solid var(--line2);color:var(--txt);border-radius:999px;padding:7px 11px;font:700 12px Inter,sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .bench button.g{border-color:var(--green-dim)}.bench button.n{opacity:.55;border-color:rgba(255,122,110,.4)}.bench button.m{border-color:rgba(255,200,87,.4)}
  .bench button.used{opacity:.35}
  .bench button.sel{background:var(--green);color:var(--ink);border-color:var(--green)}
  /* posts */
  .post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .post .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .post .ph b{color:var(--txt);font-size:13.5px}
  .post .body{margin-top:8px;font-size:14.5px;white-space:pre-line}
  .post.pinned{border-color:var(--green-dim)}
  .poll{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .poll .opt{position:relative;border:1px solid var(--line);border-radius:10px;padding:9px 12px;overflow:hidden;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
  .poll .opt i{position:absolute;left:0;top:0;bottom:0;background:var(--green-bg);z-index:0}
  .poll .opt span{position:relative;z-index:1}
  .replies{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
  .reply{font-size:13px;padding:7px 10px;border-left:3px solid var(--blue);background:var(--card2);border-radius:0 8px 8px 0}
  .reply b{font-weight:700}
  .reply small{color:var(--muted);margin-left:6px}
  .reply.me{border-left-color:var(--green)}
  .thread{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%;text-align:left;color:var(--txt)}
  .thread:hover{border-color:var(--green-dim)}
  .thread .tn{flex:1;min-width:0}
  .thread .tn b{display:block;font-size:14px}
  .thread .tn small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);flex:0 0 auto}
  .msgs{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px 2px}
  .bub{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;background:var(--card2);border:1px solid var(--line)}
  .bub.me{align-self:flex-end;background:rgba(46,224,138,.14);border-color:var(--green-dim)}
  .bub small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  /* needs list */
  .need{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
  .need .ic{font-size:18px;line-height:1.2;flex:0 0 auto}
  .need .nt{flex:1;min-width:0;font-size:13.5px}
  .need .nt b{display:block}
  .need .nt small{color:var(--muted)}
  .need .btn{flex:0 0 auto}
  /* week strip */
  .strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 10px}

/* ---------- derived helpers ---------- */
function scopeTeams(){ return S.scope==='all' ? TEAMS.map(function(x){return x.id;}) : [S.scope]; }
function inScope(tid){ return scopeTeams().indexOf(tid)>=0; }
function scopeEvents(){ return EVENTS.filter(function(e){ return inScope(e.team); }).sort(function(a,b){ return (a.date+(a.start||'00:00')) < (b.date+(b.start||'00:00')) ? -1 : 1; }); }
function eventById(id){ for(var i=0;i<EVENTS.length;i++) if(EVENTS[i].id===id) return EVENTS[i]; return null; }
function tourById(id){ for(var i=0;i<TOURN.length;i++) if(TOURN[i].id===id) return TOURN[i]; return null; }
function postById(id){ for(var i=0;i<POSTS.length;i++) if(POSTS[i].id===id) return POSTS[i]; return null; }
function threadById(id){ for(var i=0;i<THREADS.length;i++) if(THREADS[i].id===id) return THREADS[i]; return null; }
function TYPE(type){ return {training:t('Training'),match:t('Match'),tournament:t('Tournament'),duty:t('Duty'),no_session:t('No session')}[type]||type; }
function typeChip(e){ return '<span class="chip t-'+e.type+'">'+TYPE(e.type)+'</span>'; }
function teamChip(tid){ var tm=teamOf(tid); return tm?'<span class="chip teamc">'+esc(tm.label)+'</span>':''; }
function mapsUrl(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); }
function venueHtml(e){ if(!e.venue) return ''; var q=e.venue+(e.venue===CLUB.pitch?', '+CLUB.addr:''); return '📍 <a href="'+mapsUrl(q)+'" target="_blank" rel="noopener" title="'+t('Open in Google Maps')+'">'+esc(e.venue)+'</a>'+(e.field?' · '+t('Field')+' '+esc(e.field):''); }
function rsvpSum(e){
  var r={g:[],m:[],n:[],q:[]}; teamPlayers(e.team).forEach(function(p){ if(p.family!=='app') return; var v=e.rsvp[p.id]; if(v==='g') r.g.push(p); else if(v==='m') r.m.push(p); else if(v==='n') r.n.push(p); else r.q.push(p); });
  return r;
}
function regSum(e){ var r={p:0,l:0,a:0}; if(!e.register) return null; Object.keys(e.register).forEach(function(k){ r[e.register[k]]=(r[e.register[k]]||0)+1; }); return r; }
function nameList(arr){ return arr.map(function(p){ return '<b>'+esc(p.first)+'</b>'; }).join(', '); }
function attBar(e){
  if(e.status==='cancelled'||e.type==='no_session'||offOf(e.date)<0) return '';
  var r=rsvpSum(e);
  return '<div class="attbar" data-ev="'+e.id+'"><button type="button" class="a g" data-att="g">✅ '+r.g.length+'</button><button type="button" class="a m" data-att="m">❔ '+r.m.length+'</button><button type="button" class="a n" data-att="n">❌ '+r.n.length+'</button><button type="button" class="a q" data-att="q">💤 '+r.q.length+' '+t('no reply')+'</button></div>'
    +'<div class="names" id="names-'+e.id+'" hidden></div>';
}
function attNames(e, key){ var r=rsvpSum(e); var lab={g:t('Going'),m:t('Maybe'),n:t('Not going'),q:t('No reply yet')}[key]; var arr=r[key]; return '<span class="'+key+'">'+lab+':</span> '+(arr.length?nameList(arr):'—'); }
function receiptHtml(e){
  if(!e.receipt) return '';
  var h='<div class="receipt"><span>📤 '+t('Posted to')+' <b>'+e.receipt.sent+'</b> '+t('families')+'</span>';
  if(e.receipt.seen!=null) h+='<span>👀 <b>'+e.receipt.seen+'</b> '+t('seen')+'</span>';
  if(e.receipt.replied!=null&&e.type!=='no_session'&&e.status!=='cancelled') h+='<span>✋ <b>'+e.receipt.replied+'</b> '+t('replied')+'</span>';
  if(e.nudgedAt) h+='<span>🔔 '+t('reminded')+' '+fmtAgo(e.nudgedAt)+'</span>';
  return h+'</div>';
}
function evCard(e, opts){
  opts=opts||{};
  var o=offOf(e.date), past=o<0, cls='ev'+(e.status==='cancelled'?' cancelled':'')+(o===0?' today':'');
  var h='<article class="'+cls+'" id="ev-'+e.id+'"><div class="row">'+typeChip(e)+(S.scope==='all'?teamChip(e.team):'')+(e.changed?'<span class="chip amber">'+t('Changed')+'</span>':'')+(e.status==='cancelled'?'<span class="chip red">'+t('Cancelled')+'</span>':'')+(e.source==='parent'?'<span class="chip purple">'+t('Added by a parent')+'</span>':'')+(e.home===false?'<span class="chip grey">'+t('Away')+'</span>':'')+(e.result?'<span class="chip '+(e.result.us>e.result.them?'green':(e.result.us===e.result.them?'amber':'red'))+'">'+e.result.us+' – '+e.result.them+'</span>':'')+'</div>';
  h+='<h4>'+esc(e.title)+(opts.showDate?' <span class="muted" style="font-weight:600">· '+fmtDay(e.date)+'</span>':'')+'</h4>';
  if(e.start||e.arrive) h+='<div class="times">'+(e.arrive?'<span class="rep"><small>'+t('Arrive')+'</small>'+esc(e.arrive)+'</span>':'')+(e.start?'<span class="st"><small>'+(e.type==='match'||e.type==='tournament'?t('Kick-off'):t('Start'))+'</small>'+esc(e.start)+(e.ends?' – '+esc(e.ends):'')+'</span>':'')+'</div>';
  var meta=[venueHtml(e)]; if(e.details) meta.push(esc(e.details)); if(e.cancelReason) meta.push('🚫 '+esc(e.cancelReason)); if(e.sessionNote) meta.push('📝 '+esc(e.sessionNote));
  h+='<div class="meta">'+meta.filter(Boolean).join('<br>')+'</div>';
  if(past&&e.register){ var rs=regSum(e); h+='<div class="receipt"><span>📋 '+t('Register')+': <b>'+(rs.p||0)+'</b> '+t('present')+' · <b>'+(rs.l||0)+'</b> '+t('late')+' · <b>'+(rs.a||0)+'</b> '+t('absent')+'</span></div>'; }
  h+=attBar(e);
  if(!opts.noReceipt) h+=receiptHtml(e);
  if(!opts.noActs){
    var a='';
    if(e.status!=='cancelled'&&e.type!=='no_session'){
      if(!past){ var q=rsvpSum(e).q.length; if(q) a+='<button type="button" class="btn amber" data-act="nudge" data-id="'+e.id+'">🔔 '+t('Remind')+' '+q+'</button>'; }
      if(o===0||(past&&!e.register)) a+='<button type="button" class="btn blue" data-act="register" data-id="'+e.id+'">📋 '+(e.register?t('Edit register'):t('Take register'))+'</button>';
      if((e.type==='match'||e.type==='tournament')&&!past) a+='<button type="button" class="btn blue" data-act="lineup" data-id="'+e.id+'">🧩 '+t('Lineup')+(e.lineup&&e.lineup[1]&&e.lineup[1].slots.some(Boolean)?' ✓':'')+'</button>';
      if(e.type==='match'&&past) a+='<button type="button" class="btn '+(e.result?'':'primary')+'" data-act="result" data-id="'+e.id+'">'+(e.result?'✎ '+t('Edit score'):'⚽ '+t('Add the score'))+'</button>';
      if(e.tournamentId) a+='<button type="button" class="btn" data-act="tourinfo" data-id="'+e.tournamentId+'">ⓘ '+t('Tournament info')+'</button>';
      if(!past){ a+='<button type="button" class="btn" data-act="msgev" data-id="'+e.id+'">📣 '+t('Message families')+'</button>'; a+='<button type="button" class="btn" data-act="edit" data-id="'+e.id+'">✎ '+t('Edit')+'</button>'; a+='<button type="button" class="btn danger" data-act="cancel" data-id="'+e.id+'">🚫 '+t('Cancel session')+'</button>'; }
      else if(past&&e.register) a+='<button type="button" class="btn sm" data-act="register" data-id="'+e.id+'">📋 '+t('Edit register')+'</button>';
    } else if(e.status==='cancelled'&&!past){ a+='<button type="button" class="btn" data-act="restore" data-id="'+e.id+'">↩ '+t('Restore')+'</button>'; }
    if(a) h+='<div class="acts">'+a+'</div>';
  }
  return h+'</article>';
}
function nextEvent(){ var evs=scopeEvents().filter(function(e){ return e.status!=='cancelled'&&e.type!=='no_session'&&offOf(e.date)>=0; }); var now=new Date(); var hm=pad2(now.getHours())+':'+pad2(now.getMinutes()); for(var i=0;i<evs.length;i++){ var e=evs[i]; if(offOf(e.date)>0||!e.ends||e.ends>hm) return e; } return evs[0]||null; }
function unreadThreads(){ return THREADS.filter(function(th){ return inScope(th.team)&&th.unread>0; }); }
function needsList(){
  var out=[];
  unreadThreads().forEach(function(th){ out.push({ic:'💬',title:t('Message from the {f} family').replace('{f}',th.family),sub:th.msgs[th.msgs.length-1].text,act:'thread',id:th.id,btn:t('Reply')}); });
  PROPOSALS.forEach(function(pr){ if(!inScope(pr.team)) return; var clash=EVENTS.filter(function(e){ return e.team===pr.team&&e.date===pr.date&&e.status!=='cancelled'&&e.type!=='no_session'; }); out.push({ic:'📥',title:t('{who} proposed: {what}').replace('{who}',pr.by).replace('{what}',pr.title+' · '+fmtDay(pr.date)+' '+pr.start),sub:(clash.length?'⚠ '+t('Clashes with')+' '+clash[0].title+' · ':'')+pr.note,act:'proposal',id:pr.id,btn:t('Review')}); });
  scopeEvents().forEach(function(e){ if(e.type==='match'&&offOf(e.date)<0&&!e.result&&e.status!=='cancelled') out.push({ic:'⚽',title:t('Score missing')+': '+e.title,sub:fmtDay(e.date)+' · '+t('families see the result on their Stats tab once you add it'),act:'result',id:e.id,btn:t('Add')}); });
  POSTS.forEach(function(p){ if(p.kind==='poll'&&inScope(p.team)){ var answered=0; p.poll.opts.forEach(function(o){ answered+=o.v.length; }); var total=teamPlayers(p.team).filter(function(x){return x.family==='app';}).length; if(answered<total) out.push({ic:'📊',title:t('Poll closes')+' '+fmtCloses(p.poll.closes)+' · '+(total-answered)+' '+t('not answered'),sub:p.text,act:'pollnudge',id:p.id,btn:t('Remind')}); } });
  var ne=nextEvent(); if(ne){ var q=rsvpSum(ne).q.length; if(q>=3) out.push({ic:'💤',title:q+' '+t('no reply for')+' '+ne.title+' · '+fmtRel(ne.date),sub:t('Automatic reminder')+': '+t(teamOf(ne.team).nudgeWhen==='day-before-18'?'the day before at 18:00':'the morning at 08:00'),act:'nudge',id:ne.id,btn:t('Remind now')}); }
  scopeTeams().forEach(function(tid){ var np=teamPlayers(tid).filter(function(p){return p.family==='none';}); if(np.length) out.push({ic:'👨‍👩‍👧',title:np.length+' '+t('player(s) without a family in the app')+' · '+teamOf(tid).label,sub:np.map(function(p){return p.first+' '+p.last;}).join(', ')+' — '+t('invite the family with a one-time code'),act:'team',id:tid,btn:t('Invite')}); });
  return out;
}
function digest(){
  var items=[];

/* ---------- place picker (design: saved venues first, then map results) ---------- */
function placePicker(container, initial){
  var h='<div class="pp"><input type="text" class="ppIn" placeholder="'+t('Search a stadium, pitch or address…')+'" value="'+esc(initial||'')+'" autocomplete="off"><input type="hidden" class="ppVal" value="'+esc(initial||'')+'"><div class="sug" hidden></div><div class="picked"'+(initial?'':' hidden')+'>✓ <span class="pn">'+esc(initial||'')+'</span><a href="'+mapsUrl(initial||'')+'" target="_blank" rel="noopener">'+t('Open in Google Maps')+' ↗</a></div><p class="hint">'+t('Saved venues come first, then places from the map. You can also paste a Google Maps link.')+'</p></div>';
  container.innerHTML=h;
  var inp=container.querySelector('.ppIn'), val=container.querySelector('.ppVal'), sug=container.querySelector('.sug'), picked=container.querySelector('.picked');
  function choose(v){ val.value=v.n; inp.value=v.n; picked.hidden=false; picked.querySelector('.pn').textContent=v.n+(v.a?' · '+v.a:''); picked.querySelector('a').href=mapsUrl(v.n+(v.a?', '+v.a:'')); sug.hidden=true; }
  inp.addEventListener('input',function(){ var q=inp.value.trim().toLowerCase(); val.value=inp.value.trim(); picked.hidden=true; if(q.length<2){ sug.hidden=true; return; }
    if(/maps\.app\.goo\.gl|google\.[a-z.]+\/maps|goo\.gl\/maps/.test(q)){ choose({n:t('Pinned place from your link'),a:''}); return; }
    var saved=VENUES.filter(function(v){ return v.n.toLowerCase().indexOf(q)>=0; });
    var map=[{n:inp.value.trim().replace(/^\w/,function(c){return c.toUpperCase();})+' — '+t('map result'),a:'Sample town'},{n:inp.value.trim().replace(/^\w/,function(c){return c.toUpperCase();})+' Arena',a:'Sample town'}];
    sug.innerHTML=saved.map(function(v){ return '<button type="button" data-n="'+esc(v.n)+'" data-a="'+esc(v.a)+'">📌 '+esc(v.n)+'<small>'+esc(v.a)+(v.tag==='home'?' · '+t('home pitch'):'')+'</small></button>'; }).join('')+map.map(function(v){ return '<button type="button" data-n="'+esc(v.n)+'" data-a="'+esc(v.a)+'">🌍 '+esc(v.n)+'<small>'+esc(v.a)+'</small></button>'; }).join('');
    sug.hidden=false; });
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); var b=sug.querySelector('button'); if(b&&!sug.hidden) b.click(); } });
  sug.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; choose({n:b.dataset.n,a:b.dataset.a}); });
  return function(){ return val.value.trim(); };
}

var FORMS={5:['1-2-1','2-2','1-1-2'],7:['2-3-1','3-2-1','3-1-2','2-2-2','3-3'],9:['3-3-2','3-2-3','2-4-2','4-3-1'],11:['4-3-3','4-4-2','4-2-3-1','3-5-2','3-4-3']};
function slotCoords(formation){ var rows=formation.split('-').map(Number), out=[{x:50,y:89,pos:'GK'}]; rows.forEach(function(n,i){ var y=rows.length>1? 70-i*(52/(rows.length-1)) : 44; for(var j=0;j<n;j++) out.push({x:(j+1)*100/(n+1),y:y,pos:i===0?'DEF':(i===rows.length-1?'FWD':'MID')}); }); return out; }
function openLineup(e){
  var tm=teamOf(e.team), st={v:1,sel:null,selP:null,vis:tm.lineupVis};
  e.lineup=e.lineup||{}; [1,2].forEach(function(v){ if(!e.lineup[v]) e.lineup[v]={size:tm.size,formation:FORMS[tm.size][0],slots:[]}; var L=e.lineup[v]; L.slots=L.slots||[]; while(L.slots.length<L.size) L.slots.push(null); });
  function draw(){
    var L=e.lineup[st.v], coords=slotCoords(L.formation), r=rsvpSum(e), order=r.g.concat(r.m,r.q,r.n), used={}; L.slots.forEach(function(s){ if(s) used[s]=1; });
    var h=mh('🧩 '+t('Lineup')+' · '+esc(e.title), fmtRel(e.date)+(e.start?' · '+e.start:'')+' · '+t('tap a spot on the pitch, then a player'));
    h+='<div class="row between"><div class="seg">'+[1,2].map(function(v){ return '<button type="button" data-v="'+v+'" aria-pressed="'+(st.v===v)+'">'+t('Lineup')+' '+v+'</button>'; }).join('')+'</div><div class="chips" style="margin:0">'+[5,7,9,11].map(function(n){ return '<button type="button" class="fchip'+(L.size===n?' on':'')+'" data-size="'+n+'">'+n+'</button>'; }).join('')+'</div></div>';
    h+='<div class="chips">'+FORMS[L.size].map(function(f){ return '<button type="button" class="fchip'+(L.formation===f?' on blue':'')+'" data-form="'+f+'">'+f+'</button>'; }).join('')+'</div>';
    h+='<div class="luPitch"><div class="luBox top"></div><div class="luBox bot"></div>'+coords.map(function(c,i){ var pid=L.slots[i], p=pid?pl(pid):null, warn=p&&e.rsvp[p.id]==='n'; return '<button type="button" class="luSlot'+(p?' filled':'')+(st.sel===i?' sel':'')+(warn?' warn':'')+'" style="left:'+c.x+'%;top:'+c.y+'%" data-slot="'+i+'"><span class="luDot">'+(p?p.shirt:c.pos)+'</span><span class="luName">'+(p?esc(p.first):'')+'</span></button>'; }).join('')+'</div>';
    h+='<h3 class="sec" style="margin-top:4px">'+t('Bench')+' · '+t('sorted by who is going')+'</h3><div class="bench">'+order.map(function(p){ var v=e.rsvp[p.id]||'q'; return '<button type="button" class="'+(v==='g'?'g':(v==='m'?'m':(v==='n'?'n':'')))+(used[p.id]?' used':'')+(st.selP===p.id?' sel':'')+'" data-pl="'+p.id+'">'+p.shirt+' '+esc(p.first)+(v==='g'?' ✅':(v==='m'?' ❔':(v==='n'?' ❌':' 💤')))+'</button>'; }).join('')+'</div>';
    h+='<label>'+t('Families see this lineup')+'</label><div class="seg" id="luVis">'+[['2h','2 h before kick-off'],['now','As soon as saved'],['never','Never']].map(function(o){ return '<button type="button" data-vis="'+o[0]+'" aria-pressed="'+(st.vis===o[0])+'">'+t(o[1])+'</button>'; }).join('')+'</div>';
    h+='<div class="mbtns"><button type="button" class="btn" id="luClear">'+t('Clear')+'</button><button type="button" class="btn" data-close>'+t('Cancel')+'</button><button type="button" class="btn primary" id="luSave">'+t('Save lineup')+'</button></div>';
    var box=$('mbox'); box.className='mbox wide'; box.innerHTML=h; $('modal').classList.add('on');
    box.onclick=function(ev){
      var b=ev.target.closest('button'); if(!b) return;
      if(b.dataset.v){ st.v=+b.dataset.v; st.sel=null; st.selP=null; draw(); return; }
      if(b.dataset.size){ L.size=+b.dataset.size; L.formation=FORMS[L.size][0]; L.slots=L.slots.slice(0,L.size); while(L.slots.length<L.size) L.slots.push(null); st.sel=null; draw(); return; }
      if(b.dataset.form){ L.formation=b.dataset.form; draw(); return; }
      if(b.dataset.slot!=null){ var i=+b.dataset.slot; if(st.selP){ L.slots=L.slots.map(function(s){ return s===st.selP?null:s; }); L.slots[i]=st.selP; st.selP=null; st.sel=null; } else if(L.slots[i]&&st.sel===i){ L.slots[i]=null; st.sel=null; } else st.sel=i; draw(); return; }
      if(b.dataset.pl){ var pid=b.dataset.pl; if(st.sel!=null){ L.slots=L.slots.map(function(s){ return s===pid?null:s; }); L.slots[st.sel]=pid; st.sel=null; } else st.selP=(st.selP===pid?null:pid); draw(); return; }
      if(b.dataset.vis){ st.vis=b.dataset.vis; draw(); return; }
      if(b.id==='luClear'){ L.slots=L.slots.map(function(){return null;}); st.sel=null; draw(); return; }
      if(b.id==='luSave'){ tm.lineupVis=st.vis; box.onclick=null; closeModal(); renderAll(); toast(t('Lineup saved')+' · '+t({'2h':'families see it 2 h before kick-off','now':'families can see it now','never':'kept to yourself'}[st.vis])); return; }
      if(b.hasAttribute('data-close')){ box.onclick=null; closeModal(); }
    };
  }
  draw();
}

var DAYS_HR=['ponedjeljak','utorak','srijeda','četvrtak','petak','subota','nedjelja'], DAYS_HR3=['pon','uto','sri','čet','pet','sub','ned'], DAYS_EN=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
function parseMessage(text){
  var lines=text.split(/\n+/).map(function(l){return l.trim();}).filter(Boolean), rows=[], block=[];
  function flush(label){ block.forEach(function(r){ if(label&&!r.team) r.team=label; rows.push(r); }); block=[]; }
  lines.forEach(function(line){
    var low=line.toLowerCase();
    var lab=low.match(/^(?:u-?)?(20\d\d|1[0-9])\b\s*(?:[a-zšđčćž]+)?$/); if(lab&&low.length<=14){ flush(lab[1].length===2?'20'+lab[1]:lab[1]); return; }
    var days=[]; DAYS_HR.forEach(function(n,i){ if(new RegExp('(^|[^a-zšđčćž])'+n.slice(0,-1)).test(low)) days.push(i); }); if(!days.length) DAYS_HR3.forEach(function(n,i){ if(new RegExp('(^|[^a-zšđčćž])'+n+'([^a-zšđčćž]|$)').test(low)) days.push(i); }); if(!days.length) DAYS_EN.forEach(function(n,i){ if(low.indexOf(n)>=0||new RegExp('\\b'+n.slice(0,3)+'\\b').test(low)) days.push(i); });
    var tm=low.match(/(\d{1,2})[:.h](\d{2})/), time=tm?pad2(+tm[1])+':'+tm[2]:'';
    var type=/nema treninga|no training|otkazan|cancel/.test(low)?'no_session':(/turnir|tournament/.test(low)?'tournament':(/utakmic|match|game|prijateljsk|friendly/.test(low)?'match':(/trening|training/.test(low)?'training':null)));
    if(!days.length&&!time&&!type) return;
    var opp=line.match(/(?:\bvs\.?|\bv\.?|protiv|against)\s+([A-ZČĆŠĐŽ][\w\s\.]{2,30})/); var oppN=opp?opp[1].trim().replace(/[.,;]$/,''):'';
    var inline=low.match(/\b(2016|2017|2015|2018)\b/);
    if(!days.length) days=[-1];
    days.forEach(function(d){ block.push({date:d>=0?nextDow(d):'',time:time,type:type||'training',opp:oppN,team:inline?inline[1]:null,src:line}); });
  });
  flush(null);
  rows.forEach(function(r){ r.title=r.type==='match'?t('Match v')+' '+(r.opp||'…'):(r.type==='no_session'?t('No training'):TYPE(r.type)); });
  return rows;
}

    wrap.innerHTML='<h3 class="sec">'+t('What the app read')+' · '+rows.length+'</h3><div class="plist">'+rows.map(function(r,i){ return '<div class="prow" style="cursor:default;flex-wrap:wrap"><span class="pn" style="flex:1 1 180px"><b>'+(r.date?fmtDay(r.date):'<span class="chip red">'+t('Which day?')+'</span>')+' · '+(r.time||'—')+'</b><small>'+typeChip({type:r.type})+' '+esc(r.title)+'</small></span><select data-row="'+i+'" style="padding:7px 8px;width:auto;flex:0 0 auto" aria-label="'+t('Team')+'">'+'<option value="">'+t('Which team?')+'</option>'+TEAMS.map(function(x){ return '<option value="'+x.id+'"'+((r.team===x.label||r.team===x.id)?' selected':'')+'>'+x.label+'</option>'; }).join('')+'</select></div>'; }).join('')+'</div>'+(need?'<div class="note">⚠ '+t('Some lines have no team or day — pick them before posting. The app never guesses.')+'</div>':'<div class="note green">✓ '+t('Every line has a day, a time and a team.')+'</div>')+'<p class="hint">'+t('Rule learned from real messages: a bare team label (“2016”) that follows a block belongs to the block above it.')+'</p>';
    $('psPost').disabled=need;
    wrap.querySelectorAll('select[data-row]').forEach(function(s){ s.addEventListener('change',function(){ rows[+s.dataset.row].team=s.value||null; preview(); }); }); }
  $('psSample').addEventListener('click',function(){ $('psText').value=sample; });
  $('psRead').addEventListener('click',function(){ rows=parseMessage($('psText').value); rows.forEach(function(r){ if(r.team&&!teamOf(r.team)){ var tm=TEAMS.filter(function(x){return x.label===r.team;})[0]; r.team=tm?tm.id:null; } if(!r.team&&S.scope!=='all'&&TEAMS.length>1) r.team=null; }); preview(); });
  $('psPost').addEventListener('click',function(){ var n=0, fams={}; rows.forEach(function(r){ var tm=teamOf(r.team); if(!tm) return; var arr=r.time?addMin(r.time,-(r.type==='match'?tm.arrMatch:tm.arrTrain)):''; ev({team:tm.id,type:r.type,title:r.title,date:r.date,start:r.type==='no_session'?'':r.time,arrive:r.type==='no_session'?'':arr,ends:r.time?addMin(r.time,r.type==='training'?75:75):'',venue:tm.venue,field:tm.field,opp:r.opp||null,home:true,source:'paste',details:'',receipt:{sent:famCount(tm.id),seen:0,replied:0}}); n++; fams[tm.id]=1; }); closeModal(); renderAll(); S.view='upcoming'; renderSchedule(); go('schedule'); toast(t('Posted {m} event(s) to {n} families — they confirm attendance in their app').replace('{m}',n).replace('{n}',famN(Object.keys(fams)))); });
}
function openPhoto(){
  var h=mh('📷 '+t('Photo of the schedule'), t('A photo of the paper schedule or a screenshot — the app reads it the same way as pasted text; you check before posting.'));
  h+='<input type="file" accept="image/*" id="phFile"><p class="hint" style="margin-top:8px">'+t('In the design preview any image opens the same checked preview as “Paste a message”.')+'</p>';
  h+='<div class="mbtns"><button type="button" class="btn" data-close>'+t('Cancel')+'</button></div>';
  openModal(h);
  $('phFile').addEventListener('change',function(){ toast(t('Reading the photo…')); setTimeout(function(){ openPaste('ponedjeljak 19:15 trening\nsrijeda 19:15 trening\nsubota 10:00 utakmica protiv NK Levant\n2016'); $('psRead').click(); },900); });
}
/* ---------- team chooser, design notes ---------- */
function openTeamChooser(){
  var h=mh(t('Which team?'), t('The whole app follows this choice — schedule, roster, matches and messages.'));
  h+='<div class="plist">'+TEAMS.map(function(tm){ return '<button type="button" class="prow" data-scope="'+tm.id+'"><span class="av">'+tm.label.slice(2)+'</span><span class="pn"><b>'+esc(CLUB.name)+' · '+esc(tm.name)+'</b><small>'+teamPlayers(tm.id).length+' '+t('players')+' · '+famCount(tm.id)+' '+t('families')+'</small></span>'+(S.scope===tm.id?'<span class="chip green">✓</span>':'')+'</button>'; }).join('')+'<button type="button" class="prow" data-scope="all"><span class="av">∑</span><span class="pn"><b>'+t('All teams')+'</b><small>'+t('everything together, team chips on every card')+'</small></span>'+(S.scope==='all'?'<span class="chip green">✓</span>':'')+'</button></div>';
  h+='<div class="mbtns"><button type="button" class="btn" data-close>'+t('Close')+'</button></div>';
  openModal(h);
  $('mbox').querySelectorAll('[data-scope]').forEach(function(b){ b.addEventListener('click',function(){ S.scope=b.dataset.scope; closeModal(); renderAll(); }); });
}
function openNotes(){
  var h=mh('ⓘ '+t('Design notes'), t('What this preview is, and the rules it is built on.'));
  h+='<div style="font-size:13.5px;line-height:1.6"><p><b>'+t('What it is.')+'</b> '+t('The coach’s side of the PitchPro Family Schedule: the coach posts once, every family in the team gets it, parents confirm attendance in their own app. Sample data only — every name, club and venue is invented; nothing is sent anywhere.')+'</p>'
  +'<p><b>'+t('Already live in the family app')+'</b> — '+t('coach accounts by one-time code, read-only team view, attendance (Going / Maybe / Not going), lineups with formation presets, coach-posted events reaching every family, team default venue and field, tournament info with links and documents.')+'</p>'
  +'<p><b>'+t('New in this design')+'</b> — '+t('a home screen that says what needs you, edit and cancel that reach every family, pitchside register, one-tap reminders, roster and shirt numbers owned by the coach, family invites by code, announcements and polls with replies, per-family conversations, scores and recaps, tournaments, offline for today, Croatian first.')+'</p>'
  +'<p><b>'+t('Rules that never bend')+'</b> — '+t('no private channel to a child anywhere; the coach sees names, shirts and attendance — family data stays with the family; everything on the record; the app never emails or texts on the coach’s behalf during the beta; no dates of birth; ambiguous messages are asked about, never guessed.')+'</p></div>';
  h+='<div class="mbtns"><button type="button" class="btn" data-close>'+t('Close')+'</button></div>';
  openModal(h);
}

/* ---------- events: one delegated handler ---------- */
function toggleNames(id, key){ var e=eventById(id), box=$('names-'+id); if(!e||!box) return; if(!box.hidden&&box.dataset.key===key){ box.hidden=true; return; } box.dataset.key=key; box.innerHTML=attNames(e,key); box.hidden=false; }
function act(name, b){
  var id=b.dataset.id, e=id?eventById(id):null;
  switch(name){
    case 'add': openEvent(null, b.dataset.type||null); break;
    case 'edit': if(e) openEvent(e); break;
    case 'cancel': if(e) openCancel(e); break;
    case 'restore': if(e){ e.status='posted'; e.cancelReason=''; e.receipt={sent:famCount(e.team),seen:0,replied:0}; renderAll(); toast(t('Restored — families notified')); } break;
    case 'nudge': if(e) openNudge(e); break;
    case 'register': if(e) openRegister(e); break;
    case 'lineup': if(e) openLineup(e); break;
    case 'result': if(e) openResult(e); break;
    case 'recap': if(e&&e.result) openRecap(e); break;
    case 'msgev': if(e) openCompose({text:t('About')+' '+e.title+' ('+fmtDay(e.date)+(e.start?' '+e.start:'')+'): '}); break;
    case 'tourinfo': var tr=tourById(id); if(tr) openTourInfo(tr); break;
    case 'addtour': openAddTour(); break;
    case 'fixscore': var tr2=tourById(b.dataset.tour); if(tr2) openFixScore(tr2,+b.dataset.fx); break;
    case 'compose': openCompose(); break;
    case 'paste': openPaste(); break;
    case 'photo': openPhoto(); break;
    case 'thread': var th=threadById(id); if(th) openThread(th); break;
    case 'proposal': var pr=PROPOSALS.filter(function(x){return x.id===id;})[0]; if(pr) openProposal(pr); break;
    case 'pollwho': var pw=postById(id); if(pw) openPollWho(pw); break;
    case 'pollnudge': var pn=postById(id); if(pn){ pn.nudgedAt=new Date(); var n=0; var ans={}; pn.poll.opts.forEach(function(o){ o.v.forEach(function(x){ans[x]=1;}); }); teamPlayers(pn.team).forEach(function(p){ if(p.family==='app'&&!ans[p.id]) n++; }); toast(t('Reminder sent to {n} families').replace('{n}',n)); } break;
    case 'replypost': var rp=postById(id); if(rp) openReplyPost(rp); break;
    case 'pin': var pp=postById(id); if(pp){ pp.pinned=!pp.pinned; renderMessages(); toast(pp.pinned?t('Pinned for the families'):t('Unpinned')); } break;
    case 'delpost': var dp=postById(id); if(dp&&confirm(t('Delete this post for every family?'))){ POSTS.splice(POSTS.indexOf(dp),1); renderAll(); toast(t('Deleted')); } break;
    case 'team': S.scope=id||S.scope; renderAll(); go('team'); break;
    case 'settings': openSettings(b.dataset.team||null); break;
    case 'addplayer': openAddPlayer(); break;
    case 'player': var p=pl(id); if(p) openPlayer(p); break;
    case 'showinvite': var iv=INVITES.filter(function(x){return x.code===b.dataset.code;})[0]; if(iv) openInvite(iv); break;
    case 'revoke': var rv=INVITES.filter(function(x){return x.code===b.dataset.code;})[0]; if(rv&&confirm(t('Cancel this invite code?'))){ rv.status='revoked'; var rp2=pl(rv.player); if(rp2&&rp2.family==='invited') rp2.family='none'; renderAll(); toast(t('Code cancelled')); } break;
    case 'teamphoto': toast(t('Opens the phone’s picker in the real app — the photo shows on every family’s squad card')); break;
    case 'coachphoto': toast(t('Opens the phone’s picker in the real app — the photo shows on your coach card')); break;
    case 'sortplayers': S.sortName=!S.sortName; PLAYERS.sort(S.sortName?function(a,b2){ return a.last.localeCompare(b2.last); }:function(a,b2){ return a.shirt-b2.shirt; }); renderTeam(); b.textContent=S.sortName?t('Sort by shirt'):t('Sort by name'); break;
    case 'addcareer': var c=prompt(t('Club · role · years'),'NK … · Coach U-9 · 2020 – 2021'); if(c){ var s=c.split('·').map(function(x){return x.trim();}); COACH.career.unshift({club:s[0]||c,role:s[1]||'',period:s[2]||''}); renderAccount(); toast(t('Career updated on your coach card')); } break;
    case 'signout': toast(t('Signs out everywhere in the real app')); break;
  }
}
function setLang(l){ S.lang=l; try{ localStorage.setItem('ppc-lang',l); }catch(e){} renderAll(); go(S.screen,{keepScroll:true}); }
document.addEventListener('click',function(ev){
  var b=ev.target.closest('button,a,[data-go],[data-act]'); if(!b) return;
  if(b.id==='teamPill'){ openTeamChooser(); return; }
  if(b.id==='langPill'){ setLang(S.lang==='hr'?'en':'hr'); return; }
  if(b.id==='notesBtn'||b.id==='notesBtn2'){ openNotes(); return; }
  if(b.dataset.lang){ setLang(b.dataset.lang); return; }
  if(b.dataset.pref){ COACH[b.dataset.pref]=!COACH[b.dataset.pref]; renderAccount(); toast(t('Saved')); return; }
  if(b.dataset.go){ go(b.dataset.go); return; }
  if(b.dataset.att){ var wrap=b.closest('.attbar'); toggleNames(wrap.dataset.ev,b.dataset.att); return; }
  if(b.dataset.view){ S.view=b.dataset.view; renderSchedule(); return; }
  if(b.dataset.week){ S.weekOff+= +b.dataset.week; renderSchedule(); return; }
  if(b.dataset.day){ var off=offOf(b.dataset.day); S.view='week'; S.weekOff=Math.floor((off+dow(dISO(0)))/7); renderSchedule(); go('schedule'); return; }
  if(b.dataset.act){ act(b.dataset.act,b); if(b.hasAttribute('data-close')) closeModal(); return; }
  if(b.hasAttribute('data-close')){ closeModal(); return; }
});
$('modal').addEventListener('click',function(ev){ if(ev.target===$('modal')) closeModal(); });
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'&&$('modal').classList.contains('on')) closeModal(); });
/* ---------- boot ---------- */
(function boot(){
  try{ var l=localStorage.getItem('ppc-lang'); if(l==='hr'||l==='en') S.lang=l; }catch(e){}
  var m=location.hash.match(/s=(today|schedule|team|matches|messages|account)/); if(m) S.screen=m[1];
  renderAll(); go(S.screen);
  setTimeout(function(){ if(!window.ppNav) $('ppNavOpen').hidden=true; },1200);
  window.ppCoach={S:S,EVENTS:EVENTS,PLAYERS:PLAYERS,POSTS:POSTS,THREADS:THREADS,TOURN:TOURN,HR:HR,t:t,parseMessage:parseMessage};
})();
})();
</script>
<script src="site-nav.js" defer></script>
